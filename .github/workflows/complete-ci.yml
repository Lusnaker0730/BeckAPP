name: Complete CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml
  
  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yml
  
  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker-build.yml
    needs: [backend-tests, frontend-tests]
  
  code-quality:
    name: Code Quality
    uses: ./.github/workflows/code-quality.yml
  
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, docker-build, code-quality]
    if: always()
    
    steps:
    - name: Check all jobs status
      run: |
        echo "Backend Tests: ${{ needs.backend-tests.result }}"
        echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
        echo "Docker Build: ${{ needs.docker-build.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
    
    - name: Post summary to PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v8
      with:
        script: |
          const summary = `
          ## CI Pipeline Results
          
          | Job | Status |
          |-----|--------|
          | Backend Tests | ${{ needs.backend-tests.result }} |
          | Frontend Tests | ${{ needs.frontend-tests.result }} |
          | Docker Build | ${{ needs.docker-build.result }} |
          | Code Quality | ${{ needs.code-quality.result }} |
          
          ${context.payload.pull_request.number ? `View details in [Actions](${context.payload.repository.html_url}/actions/runs/${context.runId})` : ''}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

