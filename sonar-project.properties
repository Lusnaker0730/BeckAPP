# SonarCloud 配置
# https://docs.sonarcloud.io/

sonar.projectKey=fhir-analytics-platform
sonar.organization=your-organization

# Project information
sonar.projectName=FHIR Analytics Platform
sonar.projectVersion=1.0

# Source code
sonar.sources=backend/app,frontend/src,etl-service/app,analytics-service/app
sonar.tests=backend/tests,frontend/src
sonar.language=py,js

# Python specific
sonar.python.version=3.11
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.xunit.reportPath=backend/pytest-report.xml

# JavaScript specific
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/__pycache__/**,**/migrations/**,**/tests/**,**/venv/**,**/env/**

# Test exclusions
sonar.test.exclusions=**/tests/**,**/*.test.js,**/*.spec.js

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/__init__.py,**/main.py,**/config.py

# Encoding
sonar.sourceEncoding=UTF-8

# Issue filtering
sonar.issue.ignore.multicriteria=e1,e2

# Ignore TODO comments
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# Ignore complexity
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

